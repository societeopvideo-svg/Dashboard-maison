<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maison">
<meta name="theme-color" content="#0F1B2D" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4EEE3" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css?v=20261120h">
<title>Maison</title>
</head>
<body>
<header class="top">
  <div class="clock"><span id="time">--:--</span><span id="date"></span></div>
  <div class="top-right">
    <span id="status" class="status" title="Connexion Homey"></span>
    <button id="btn-refresh" class="icon-btn" aria-label="Actualiser"></button>
    <button id="btn-full" class="icon-btn" aria-label="Plein écran" hidden></button>
    <button id="btn-settings" class="icon-btn" aria-label="Réglages"></button>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabs" id="tabs" aria-label="Navigation"></nav>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sleep" hidden></div>
<script>
  // Affiche les erreurs à l'écran plutôt qu'une page vide
  function showErr(m) { var v = document.getElementById('view'); if (v) v.innerHTML = '<div class="empty">Erreur du dashboard : ' + String(m).replace(/</g, '&lt;') + '<br>Recharge la page (Cmd + Maj + R). Si ça persiste, envoie ce message.</div>'; }
  window.addEventListener('error', function (e) { showErr(e.message); });
</script>
<script type="module" src="js/app.js?v=20261120h"></script>
</body>
</html>
